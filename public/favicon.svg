<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Modern Compass Mark for FinPilot -->
  <defs>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with sleek bezel -->
  <circle cx="16" cy="16" r="14" stroke="url(#compassGrad)" stroke-width="2.5" fill="#f0fdf4" />
  
  <!-- Cardinal Tick Marks -->
  <line x1="16" y1="3.5" x2="16" y2="6" stroke="#059669" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="26" x2="16" y2="28.5" stroke="#059669" stroke-width="2" stroke-linecap="round" />
  <line x1="3.5" y1="16" x2="6" y2="16" stroke="#059669" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="16" x2="28.5" y2="16" stroke="#059669" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Rotated Compass Needle (North-East pointing, symbolizing growth) -->
  <g transform="rotate(45 16 16)">
    <!-- North Pointer (Vibrant Emerald) -->
    <polygon points="16,5 19,16 16,14.5" fill="url(#needleNorth)" />
    <polygon points="16,5 13,16 16,14.5" fill="#34d399" />
    
    <!-- South Pointer (Slate) -->
    <polygon points="16,27 19,16 16,17.5" fill="#94a3b8" />
    <polygon points="16,27 13,16 16,17.5" fill="#cbd5e1" />
    
    <!-- Center Pivot Pin -->
    <circle cx="16" cy="16" r="2.5" fill="#0f172a" />
    <circle cx="16" cy="16" r="1" fill="#ffffff" />
  </g>
</svg>